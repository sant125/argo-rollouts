apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: karpenter-nodepool
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sant125/argo-rollouts.git
    targetRevision: main
    path: gitops/platform/karpenter
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, SkipDryRunOnMissingResource=true]
    retry: # CRD de outra Application pode ainda não existir: tenta de novo
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
