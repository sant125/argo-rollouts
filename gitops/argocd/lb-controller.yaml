apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: aws-load-balancer-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    targetRevision: 3.5.0
    helm:
      valuesObject:
        clusterName: lab-dev
        region: us-east-1
        vpcId: "vpc-0f27b14b3ae1576a1"
        serviceAccount:
          name: aws-load-balancer-controller # bate com a associação do Pod Identity
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true]
    retry: # CRD de outra Application pode ainda não existir: tenta de novo
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
