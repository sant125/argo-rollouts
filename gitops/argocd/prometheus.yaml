apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 91.9.0
    helm:
      releaseName: kube-prometheus-stack # define o nome do Service que a análise consulta
      valuesObject:
        grafana: {enabled: false}
        alertmanager: {enabled: false}
        prometheus:
          prometheusSpec:
            podMonitorSelectorNilUsesHelmValues: false # pega PodMonitor de qualquer namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: # CRD de outra Application pode ainda não existir: tenta de novo
      limit: 10
      backoff: {duration: 30s, factor: 2, maxDuration: 5m}
