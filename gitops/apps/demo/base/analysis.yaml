apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: taxa-de-erro
  namespace: demo
spec:
  args:
    - name: canary-hash
  metrics:
    - name: taxa-de-erro
      initialDelay: 30s # espera a primeira coleta
      interval: 30s
      failureLimit: 1
      # sem tráfego a query dá NaN, que não bate com nenhuma das duas: Inconclusive,
      # e o Rollout pausa esperando promote/abort em vez de aprovar no escuro
      successCondition: result[0] <= 0.05
      failureCondition: result[0] > 0.05
      provider:
        prometheus:
          address: http://kube-prometheus-stack-prometheus.monitoring.svc:9090
          query: |
            sum(rate(http_requests_total{code="500", rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
            /
            sum(rate(http_requests_total{rollouts_pod_template_hash="{{args.canary-hash}}"}[1m]))
